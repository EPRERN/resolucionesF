<div class="overlay" *ngIf="safeUrl" (click)="cerrar()">
  <div class="modal" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="cerrar()">X</button>
    <iframe
      [src]="safeUrl"
      width="100%"
      height="600px"
      style="border: none;"
    ></iframe>
  </div>
</div>
